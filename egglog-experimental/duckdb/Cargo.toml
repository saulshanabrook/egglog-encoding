[package]
name = "egglog-experimental-duckdb"
version = "0.1.0"
edition = "2024"
description = "An experimental DuckDB-authoritative egglog backend."
license = "MIT"
publish = false

[features]
default = []
bundled = ["duckdb/bundled"]

[dependencies]
