[package]
name = "egglog-gpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Replacement relational backend for term-encoded egglog with Vulkan and simulation"

[dependencies]
egglog.workspace = true
egglog-core-relations.workspace = true
egglog-numeric-id.workspace = true
egglog-experimental = { path = "../egglog-experimental" }
wgpu = { version = "26", default-features = false, features = ["std", "vulkan", "wgsl"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }

[dev-dependencies]
rand.workspace = true
naga = { version = "26", features = ["wgsl-in"] }
