[package]
name = "slotted-reference"
version = "0.1.0"
edition = "2021"

[dependencies]
benchmark-memory = { path = "../benchmark-memory" }
egraph-isomorphism = { path = "../egraph-isomorphism" }
serde_json = "1.0"
num-bigint = "0.4"
# Pinned to a REV rather than a local path, so a runner with no checkout of the
# reference can build this and the differential half can run in CI.
#
# This is upstream `main` at 48cefee plus one read-only symmetry-generators
# accessor (4480b8f in the fork); matching and rewriting are unchanged.
# Upstream includes: PR 46 (the multipattern matcher with mid-match
# `unify`), PR 50 (a symmetric class's every reading is matched), and the maintainer's
# fix for the weak shape of a node that reuses one printed name in bound and free
# positions (`let $x := $x in $x`), which https://github.com/memoryleak47/slotted-egraphs/pull/51
# reported. The harness asks nothing of the reference beyond `main`'s `MultiPattern`:
# a binder column holds a slot literal, never a pattern variable.
#
# Matching here reads a binder's bound slot as any name, a free variable's included,
# and so does the encoding; a rule that rebinds such a slot over something it matched
# outside the binder owes a `not-free` guard (`capture_guards` in the encoder), which
# both sides evaluate. The oracle is not asked to be stricter than that.
#
# Differential checks use `MultiPattern` for the full encoding and `ematch_all`
# for its optional nested compatibility mode. Both use matching snapshot
# substitution. The separate nested performance baseline keeps the artifact's
# syntactic substitution. The `checks` feature and explicit `eg.check()` calls
# make malformed reference state a hard failure.
slotted-egraphs = { git = "https://github.com/oflatt-claude/slotted-egraphs.git", rev = "4480b8f3085b61d93a576ea3eb5e2390ac6a507f" }

[features]
# The differential harness wants malformed reference state to be a hard failure, so
# the crate's `checks` are on by default. A timing run wants the crate as the paper's
# experiments ran it: `cargo build --release --no-default-features`, which is what
# the shared benchmark builder does. The binary says which it is on its `CONFIG` line.
# The experimental dev-dependency opts out; Make selects the paper package alone
# after the checked workspace phase, preserving this boundary without another suite.
default = ["checks"]
checks = ["slotted-egraphs/checks"]
explanations = ["slotted-egraphs/explanations"]

[dev-dependencies]
tempfile = "3"
